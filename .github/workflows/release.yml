name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type-check
        working-directory: app
        run: npx tsc --noEmit

      - name: Build renderer / main / preload
        working-directory: app
        run: npx vite build

      - name: Prepare macOS signing & notarization
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CSC_LINK:-}" ] || [ -z "${MAC_CSC_KEY_PASSWORD:-}" ]; then
            echo "::error::缺少签名证书 Secret：需要 MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD"
            exit 1
          fi
          if [ -z "${APPLE_API_KEY_B64:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "::error::缺少公证 API Key Secret：需要 APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER"
            exit 1
          fi
          # 1) Apple 公证密钥：APPLE_API_KEY 里存的是 .p8 的 base64，而 notarytool --key 需要真实文件路径
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_API_KEY_B64, 'base64'))" "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

          # 2) 签名证书：还原 .p12，并「自建 keychain + 导入」
          #    为什么不交给 electron-builder 自己建：app-builder-lib 24.x 的 createKeychain() 用随机密码建 keychain，
          #    却在 set-key-partition-list 里误把「p12 密码」当「keychain 密码」用（macCodeSign.js:137-163），
          #    必然报 `SecKeychainUnlock: The user name or passphrase you entered is not correct.`。
          #    只要不设 CSC_LINK，electron-builder 就走 `CSC_KEYCHAIN` 分支（macPackager.js:25-29），
          #    跳过那段代码，直接用我们准备好的 keychain 签名。
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.MAC_CSC_LINK, 'base64'))" "$RUNNER_TEMP/certificate.p12"
          chmod 600 "$RUNNER_TEMP/certificate.p12"

          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(node -e 'process.stdout.write(require("crypto").randomBytes(24).toString("base64"))')"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          # 关键：-k 必须是 keychain 自己的密码（这里是 KEYCHAIN_PW）
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::keychain 里没有可用的 Developer ID Application 身份（证书类型不对、或已过期）"
            exit 1
          fi

          {
            echo "CSC_KEYCHAIN=$KEYCHAIN"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
          # 故意不导出 CSC_LINK / CSC_KEY_PASSWORD：否则 electron-builder 会回到有 bug 的 createKeychain 分支

      - name: Package & publish (${{ runner.os }})
        working-directory: app
        run: npx electron-builder ${{ matrix.args }} --publish always

      - name: Verify macOS signature & notarization
        if: matrix.os == 'macos-latest'
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          # ---- .app：签名 + 公证票据 ----
          APP=$(ls -d release/*/mac*/*.app | head -1)
          echo "app bundle: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::app 未使用 Developer ID Application 证书签名"; exit 1; }
          # 公证票据是否已装订（@electron/notarize 公证成功后会自动 staple）
          xcrun stapler validate "$APP"

          # ---- .dmg：签名 + 公证票据 + Gatekeeper 放行 ----
          DMG=$(ls release/*/*.dmg | head -1)
          echo "dmg: $DMG"
          codesign --verify --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature "$DMG"

      - name: Verify artifacts
        working-directory: app
        shell: bash
        run: |
          ls -la release
          test -n "$(ls release/**/*.{exe,dmg,AppImage} 2>/dev/null | head -1)" || echo "no installer artifact found"
